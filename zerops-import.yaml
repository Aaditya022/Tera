# yamlPreprocessor=on
project:
  name: tera
  description: Tera restaurant management demo
  corePackage: LIGHT
  tags:
    - tera
    - demo
  vault:
    PRODUCTION: "true"
    ROOT_PATH: /api
    CORS_ORIGINS: https://tera.zerops.app
    PUBLIC_APP_BASE_URL: https://tera.zerops.app
    SECRET_KEY:
      value: <@generateRandomString(32)>
      sensitive: true
    REFRESH_SECRET_KEY:
      value: <@generateRandomString(32)>
      sensitive: true
services:
  - hostname: vol
    type: local-storage:single@1
    priority: 20
    verticalAutoscaling:
      minDisk: 5
      maxDisk: 5
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 19
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.25
      maxRam: 0.25
      minDisk: 1
      maxDisk: 1
  - hostname: redis
    type: valkey:single@9.0
    profile: hobby
    priority: 18
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.25
      maxRam: 0.25
      minDisk: 1
      maxDisk: 1
  - hostname: web
    type: alpine/nginx@latest
    priority: 10
    enableSubdomainAccess: true
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.25
      maxRam: 0.25
      minDisk: 1
      maxDisk: 1
  - hostname: api
    type: alpine/python@3.12
    priority: 9
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.25
      maxRam: 0.25
      minDisk: 1
      maxDisk: 1
  - hostname: ws
    type: alpine/python@3.12
    priority: 8
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      minRam: 0.25
      maxRam: 0.25
      minDisk: 1
      maxDisk: 1
